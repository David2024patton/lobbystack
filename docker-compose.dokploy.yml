services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lobbystack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LOBBYSTACK_MIGRATOR_PASSWORD: ${LOBBYSTACK_MIGRATOR_PASSWORD:?LOBBYSTACK_MIGRATOR_PASSWORD is required}
      LOBBYSTACK_AUTH_PASSWORD: ${LOBBYSTACK_AUTH_PASSWORD:?LOBBYSTACK_AUTH_PASSWORD is required}
      LOBBYSTACK_APP_PASSWORD: ${LOBBYSTACK_APP_PASSWORD:?LOBBYSTACK_APP_PASSWORD is required}
      LOBBYSTACK_WORKER_PASSWORD: ${LOBBYSTACK_WORKER_PASSWORD:?LOBBYSTACK_WORKER_PASSWORD is required}
      LOBBYSTACK_DISPATCHER_PASSWORD: ${LOBBYSTACK_DISPATCHER_PASSWORD:?LOBBYSTACK_DISPATCHER_PASSWORD is required}
      LOBBYSTACK_READONLY_PASSWORD: ${LOBBYSTACK_READONLY_PASSWORD:?LOBBYSTACK_READONLY_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lobbystack"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-development}
        NEXT_PUBLIC_WEB_CALL_ENDPOINT: ${NEXT_PUBLIC_WEB_CALL_ENDPOINT:-}
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/lobbystack
      OTEL_SERVICE_NAME: lobbystack-migrator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-development}
        NEXT_PUBLIC_WEB_CALL_ENDPOINT: ${NEXT_PUBLIC_WEB_CALL_ENDPOINT:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOBBYSTACK_MAINTENANCE_MODE: ${LOBBYSTACK_MAINTENANCE_MODE:-false}
      LOBBYSTACK_CERTIFICATION_MODE: ${LOBBYSTACK_CERTIFICATION_MODE:-false}
      LOBBYSTACK_CERTIFICATION_EMAILS: ${LOBBYSTACK_CERTIFICATION_EMAILS:-}
      LOBBYSTACK_CERTIFICATION_PHONES: ${LOBBYSTACK_CERTIFICATION_PHONES:-}
      LOBBYSTACK_CERTIFICATION_CALENDARS: ${LOBBYSTACK_CERTIFICATION_CALENDARS:-}
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-https://lobby.itak.live}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://ts.lobbystack.com}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_CHAT_PROVIDER_NAME: ${AI_CHAT_PROVIDER_NAME:-openai}
      AI_CHAT_INPUT_COST_PER_MILLION_TOKENS: ${AI_CHAT_INPUT_COST_PER_MILLION_TOKENS:-0.15}
      AI_CHAT_OUTPUT_COST_PER_MILLION_TOKENS: ${AI_CHAT_OUTPUT_COST_PER_MILLION_TOKENS:-0.60}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_PROVIDER_NAME: ${AI_EMBEDDING_PROVIDER_NAME:-openai}
      AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-1}
      WIDGET_SESSION_SECRET: ${WIDGET_SESSION_SECRET:?WIDGET_SESSION_SECRET is required}
      PROSPECT_DEMO_OPERATOR_EMAIL: ${PROSPECT_DEMO_OPERATOR_EMAIL:-}
      DATABASE_URL: ${LOBBYSTACK_APP_DATABASE_URL:?LOBBYSTACK_APP_DATABASE_URL is required}
      LOBBYSTACK_APP_DATABASE_URL: ${LOBBYSTACK_APP_DATABASE_URL:?LOBBYSTACK_APP_DATABASE_URL is required}
      LOBBYSTACK_AUTH_DATABASE_URL: ${LOBBYSTACK_AUTH_DATABASE_URL:?LOBBYSTACK_AUTH_DATABASE_URL is required}
      LOBBYSTACK_WORKER_DATABASE_URL: ${LOBBYSTACK_WORKER_DATABASE_URL:?LOBBYSTACK_WORKER_DATABASE_URL is required}
      LOBBYSTACK_DISPATCHER_DATABASE_URL: ${LOBBYSTACK_DISPATCHER_DATABASE_URL:?LOBBYSTACK_DISPATCHER_DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SEND_VERIFICATION_EMAIL_ON_SIGNUP: ${SEND_VERIFICATION_EMAIL_ON_SIGNUP:-false}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      INTERNAL_SERVICE_ID: lobbystack-voice-gateway
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_ALERT_SMS_FROM: ${TWILIO_ALERT_SMS_FROM:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      NUMBER_CLAIM_TOKEN_SECRET: ${NUMBER_CLAIM_TOKEN_SECRET:-}
      TWILIO_SMS_WEBHOOK_URL: ${TWILIO_SMS_WEBHOOK_URL:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_API_BASE_URL: ${POLAR_API_BASE_URL:-}
      POLAR_STARTER_MONTHLY_PRODUCT_ID: ${POLAR_STARTER_MONTHLY_PRODUCT_ID:-}
      POLAR_STARTER_ANNUAL_PRODUCT_ID: ${POLAR_STARTER_ANNUAL_PRODUCT_ID:-}
      POLAR_PRO_MONTHLY_PRODUCT_ID: ${POLAR_PRO_MONTHLY_PRODUCT_ID:-}
      POLAR_PRO_ANNUAL_PRODUCT_ID: ${POLAR_PRO_ANNUAL_PRODUCT_ID:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/calendar/google/callback}
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      LOCAL_STORAGE_PATH: /var/lib/lobbystack/storage
      LOCAL_STORAGE_SIGNING_SECRET: ${LOCAL_STORAGE_SIGNING_SECRET:?LOCAL_STORAGE_SIGNING_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      OTEL_SERVICE_NAME: lobbystack-admin
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/lib/lobbystack/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.lobbystack.rule=Host(`lobby.itak.live`)
      - traefik.http.routers.lobbystack.entrypoints=websecure
      - traefik.http.routers.lobbystack.tls=true
      - traefik.http.routers.lobbystack.tls.certresolver=letsencrypt
      - traefik.http.services.lobbystack.loadbalancer.server.port=3000
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.lobbystack-http.rule=Host(`lobby.itak.live`)
      - traefik.http.routers.lobbystack-http.entrypoints=web
      - traefik.http.routers.lobbystack-http.middlewares=redirect-to-https@file

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-development}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOBBYSTACK_MAINTENANCE_MODE: ${LOBBYSTACK_MAINTENANCE_MODE:-false}
      LOBBYSTACK_CERTIFICATION_MODE: ${LOBBYSTACK_CERTIFICATION_MODE:-false}
      LOBBYSTACK_CERTIFICATION_EMAILS: ${LOBBYSTACK_CERTIFICATION_EMAILS:-}
      LOBBYSTACK_CERTIFICATION_PHONES: ${LOBBYSTACK_CERTIFICATION_PHONES:-}
      LOBBYSTACK_CERTIFICATION_CALENDARS: ${LOBBYSTACK_CERTIFICATION_CALENDARS:-}
      PORT: 3002
      APP_BASE_URL: ${APP_BASE_URL:-https://lobby.itak.live}
      DATABASE_URL: ${LOBBYSTACK_WORKER_DATABASE_URL:?LOBBYSTACK_WORKER_DATABASE_URL is required}
      LOBBYSTACK_WORKER_DATABASE_URL: ${LOBBYSTACK_WORKER_DATABASE_URL:?LOBBYSTACK_WORKER_DATABASE_URL is required}
      LOBBYSTACK_DISPATCHER_DATABASE_URL: ${LOBBYSTACK_DISPATCHER_DATABASE_URL:?LOBBYSTACK_DISPATCHER_DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: lobbystack
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-LobbyStack <no-reply@localhost>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      LOCAL_STORAGE_PATH: /var/lib/lobbystack/storage
      LOCAL_STORAGE_SIGNING_SECRET: ${LOCAL_STORAGE_SIGNING_SECRET:?LOCAL_STORAGE_SIGNING_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_CHAT_PROVIDER_NAME: ${AI_CHAT_PROVIDER_NAME:-openai}
      AI_CHAT_INPUT_COST_PER_MILLION_TOKENS: ${AI_CHAT_INPUT_COST_PER_MILLION_TOKENS:-0.15}
      AI_CHAT_OUTPUT_COST_PER_MILLION_TOKENS: ${AI_CHAT_OUTPUT_COST_PER_MILLION_TOKENS:-0.60}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_PROVIDER_NAME: ${AI_EMBEDDING_PROVIDER_NAME:-openai}
      AI_EMBEDDING_REVISION: ${AI_EMBEDDING_REVISION:-1}
      AI_EMBEDDING_INPUT_COST_PER_MILLION_TOKENS: ${AI_EMBEDDING_INPUT_COST_PER_MILLION_TOKENS:-0.02}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_ALERT_SMS_FROM: ${TWILIO_ALERT_SMS_FROM:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      OTEL_SERVICE_NAME: lobbystack-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/calendar/google/callback}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_USAGE_METER_ID: ${POLAR_USAGE_METER_ID:-}
      POLAR_API_BASE_URL: ${POLAR_API_BASE_URL:-}
      POLAR_STARTER_MONTHLY_PRODUCT_ID: ${POLAR_STARTER_MONTHLY_PRODUCT_ID:-}
      POLAR_STARTER_ANNUAL_PRODUCT_ID: ${POLAR_STARTER_ANNUAL_PRODUCT_ID:-}
      POLAR_PRO_MONTHLY_PRODUCT_ID: ${POLAR_PRO_MONTHLY_PRODUCT_ID:-}
      POLAR_PRO_ANNUAL_PRODUCT_ID: ${POLAR_PRO_ANNUAL_PRODUCT_ID:-}
      POLAR_STARTER_MONTHLY_AI_SMS_PRODUCT_ID: ${POLAR_STARTER_MONTHLY_AI_SMS_PRODUCT_ID:-}
      POLAR_STARTER_ANNUAL_AI_SMS_PRODUCT_ID: ${POLAR_STARTER_ANNUAL_AI_SMS_PRODUCT_ID:-}
      POLAR_PRO_MONTHLY_AI_SMS_PRODUCT_ID: ${POLAR_PRO_MONTHLY_AI_SMS_PRODUCT_ID:-}
      POLAR_PRO_ANNUAL_AI_SMS_PRODUCT_ID: ${POLAR_PRO_ANNUAL_AI_SMS_PRODUCT_ID:-}
      POLAR_AI_SMS_SETUP_PRODUCT_ID: ${POLAR_AI_SMS_SETUP_PRODUCT_ID:-}
      POLAR_AI_SMS_ADDON_PRODUCT_ID: ${POLAR_AI_SMS_ADDON_PRODUCT_ID:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    volumes:
      - storage_data:/var/lib/lobbystack/storage
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  voice-gateway:
    build:
      context: .
      dockerfile: docker/voice-gateway/Dockerfile
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-development}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOBBYSTACK_MAINTENANCE_MODE: ${LOBBYSTACK_MAINTENANCE_MODE:-false}
      LOBBYSTACK_CERTIFICATION_MODE: ${LOBBYSTACK_CERTIFICATION_MODE:-false}
      LOBBYSTACK_CERTIFICATION_EMAILS: ${LOBBYSTACK_CERTIFICATION_EMAILS:-}
      LOBBYSTACK_CERTIFICATION_PHONES: ${LOBBYSTACK_CERTIFICATION_PHONES:-}
      LOBBYSTACK_CERTIFICATION_CALENDARS: ${LOBBYSTACK_CERTIFICATION_CALENDARS:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted_standard}
      PORT: 3001
      VOICE_GATEWAY_BASE_URL: ${VOICE_GATEWAY_BASE_URL:-http://localhost:3001}
      APP_BASE_URL: ${APP_BASE_URL:-https://lobby.itak.live}
      BACKEND_INTERNAL_URL: http://admin:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      VOICE_GATEWAY_SERVICE_ID: lobbystack-voice-gateway
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEB_CALL_PUBLIC_BUSINESS_SLUG: ${WEB_CALL_PUBLIC_BUSINESS_SLUG:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_ALERT_SMS_FROM: ${TWILIO_ALERT_SMS_FROM:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OTEL_SERVICE_NAME: lobbystack-voice-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12



networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  storage_data:
